# Render Blueprint — UgaMarket API (free plan).
# Render dashboard → New → Blueprint → pick this repository.
# See docs/FREE_DEPLOYMENT.md for the full walkthrough.
#
# Free-plan notes:
# - No pre-deploy command on free: migrations run at start (idempotent).
# - No shell on free: the first start seeds an EMPTY database automatically
#   (seeds/seedIfEmpty.js); later starts never re-seed.
# - Ephemeral disk: product photos MUST go to Cloudinary (CLOUDINARY_URL).
# - Health check uses /api/ping (no database) so the free Neon database can sleep.
services:
  - type: web
    name: ugamarket-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node seeds/seedIfEmpty.js && node server.js
    healthCheckPath: /api/ping
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Neon "direct" connection string (not the -pooler one), e.g.
      # postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/ugamarket?sslmode=require&connection_limit=5
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_JWT_EXPIRES_IN
        value: 1d
      # The one super admin / owner (used only by the first-start seed).
      # Other staff are added later in the admin console → Staff accounts.
      - key: ADMIN_1_EMAIL
        sync: false
      - key: ADMIN_1_PASSWORD
        sync: false
      - key: ADMIN_1_NAME
        value: Owner
      # Your two Vercel URLs, comma-separated (no trailing slash)
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # "Continue with Google": OAuth Web client ID (Google Cloud Console →
      # APIs & Services → Credentials). Same value as the shop's
      # REACT_APP_GOOGLE_CLIENT_ID. Empty disables Google sign-in.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Payments: JJuma Global hosted checkout (MTN MoMo + Airtel Money)
      - key: PAYMENT_PROVIDER
        value: JJUMA
      # TEST with bp_test_ keys; switch to LIVE together with bp_live_ keys
      - key: PAYMENT_MODE
        value: TEST
      - key: JJUMA_API_BASE_URL
        value: https://api.jjuma.com
      # JJuma dashboard → API Keys (public key creates payments)
      - key: JJUMA_PUBLIC_KEY
        sync: false
      # JJuma dashboard → API Keys (secret key verifies payments; server only)
      - key: JJUMA_SECRET_KEY
        sync: false
      # JJuma dashboard → Tools → Webhooks → signing secret. Webhook URL to
      # register there: https://<this-service>.onrender.com/api/payments/webhook
      - key: JJUMA_WEBHOOK_SECRET
        sync: false
      # Internal signing secret (development mock provider); any random value
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      # cloudinary://<api_key>:<api_secret>@<cloud_name>  (Cloudinary dashboard)
      - key: CLOUDINARY_URL
        sync: false
      - key: WAREHOUSE_LATITUDE
        value: "0.3136"
      - key: WAREHOUSE_LONGITUDE
        value: "32.5811"
      - key: GEOCODER_PROVIDER
        value: NOMINATIM
      - key: ROUTING_PROVIDER
        value: OSRM
      - key: GEO_CONTACT_EMAIL
        sync: false
      - key: TRANSLATION_PROVIDER
        value: MYMEMORY
      - key: MYMEMORY_EMAIL
        sync: false
      # ── Verification codes, newsletter (email + SMS) ──
      # SMTP (e.g. Gmail app password, Zoho, Brevo) or RESEND.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Phone (SMS) verification is OFF for now: codes go by email. To turn it
      # on later set SMS_VERIFICATION_ENABLED=true, SMS_PROVIDER=AFRICASTALKING
      # and the AT_* keys below.
      - key: SMS_VERIFICATION_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: LOG
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: SMS_DELIVERY_REPORT_TOKEN
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # ── Voice calls: TURN relay so calls connect from any network/country ──
      # Recommended: Cloudflare Realtime TURN (key id + API token).
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
